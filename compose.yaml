services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    networks:
      - practice-net  
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "5000:5000"
    networks:
      - practice-net
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379
  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - practice-net
networks:
  practice-net:
volumes:
  redis-data:
