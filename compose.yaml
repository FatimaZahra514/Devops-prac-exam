services:
  notes:
    build: .
    ports:
      - "8080:5000"
    environment:
      APP_NAME: Fatima's Notes
      DATABASE: /data/notes.db
    volumes:
      - notes-data:/data
    networks:
      - notes-net

  helper:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - notes-net

networks:
  notes-net:

volumes:
  notes-data:
  redis-data: